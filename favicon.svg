<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="256" height="256" fill="#F9F7F4"/>
  
  <!-- Compass circle -->
  <circle cx="128" cy="128" r="85" fill="none" stroke="#2D5A3D" stroke-width="6"/>
  
  <!-- Compass points (8-point star) -->
  <g stroke="#2D5A3D" stroke-width="5" fill="#2D5A3D">
    <!-- North point -->
    <polygon points="128,30 140,65 116,65"/>
    <!-- Northeast point -->
    <polygon points="190,65 165,90 185,75"/>
    <!-- East point -->
    <polygon points="225,128 190,140 190,116"/>
    <!-- Southeast point -->
    <polygon points="190,190 165,165 185,180"/>
    <!-- South point -->
    <polygon points="128,225 140,190 116,190"/>
    <!-- Southwest point -->
    <polygon points="65,190 90,165 70,180"/>
    <!-- West point -->
    <polygon points="30,128 65,140 65,116"/>
    <!-- Northwest point -->
    <polygon points="65,65 90,90 70,75"/>
  </g>
  
  <!-- Pen nib (diagonal across compass) -->
  <g transform="translate(128, 128) rotate(45)">
    <!-- Pen shaft -->
    <rect x="-8" y="-60" width="16" height="130" fill="#1a1a1a" rx="8"/>
    
    <!-- Pen nib -->
    <g transform="translate(0, 70)">
      <!-- Nib split -->
      <path d="M -3 0 L -5 12 L -2 8 L 0 15 L 2 8 L 5 12 L 3 0" fill="#333333" stroke="#1a1a1a" stroke-width="0.5"/>
      <!-- Inner detail -->
      <ellipse cx="0" cy="3" rx="2" ry="3" fill="#555555"/>
    </g>
  </g>
</svg>
