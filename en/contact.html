<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Vuler Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1C2B22; --primary: #2D5A3D; --primary-light: #3D7A4D; --terracotta: #B8654A; --paper: #F5EFE1; --stone: #EAE0CB; --line: #D8CBA8; --white: #FFFDF8;
    --text-secondary: #4A4032;
    --text-muted: #8a7c5c;
    --surface: var(--white); --whatsapp: #25D366; }
  :root.dark-mode {
    --ink: #F5EFE1;
    --paper: #1C2B22;
    --surface: #24352A;
    --stone: #2E4033;
    --line: #3E5245;
    --text-secondary: #C9BFA8;
    --text-muted: #A99B7A;
  }
  .lang-selector { display: flex; gap: 0.4rem; align-items: center; }
  .lang-selector a { padding: 0.3rem 0.55rem; font-size: 0.8rem; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); text-decoration: none; }
  .lang-selector a.active { background: var(--primary); color: var(--white); border-color: var(--primary); }
  .lang-selector a:hover:not(.active) { border-color: var(--primary); }
  .mode-toggle { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 0.3rem 0.55rem; cursor: pointer; font-size: 0.95rem; line-height: 1; color: var(--ink); }
  .nav-right { display: flex; align-items: center; gap: 1rem; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Lora', Georgia, serif; font-size: 16px; line-height: 1.55; color: var(--ink); background: var(--paper); }
  .display { font-family: 'Archivo Black', 'Helvetica Neue', sans-serif; line-height: 1.1; letter-spacing: -0.01em; }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 2rem; }
  header { padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
  nav { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Archivo Black', sans-serif; font-size: 1.1rem; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { color: var(--ink); text-decoration: none; font-size: 0.93rem; }
  .nav-links a.active { color: var(--primary); font-weight: 600; }
  .nav-links a:hover { color: var(--primary); }
  .page-hero { padding: 2rem 0 1.5rem; text-align: center; }
  .page-hero h1 { font-size: 2.1rem; margin-bottom: 0.5rem; }
  .page-hero p { color: var(--text-secondary); max-width: 56ch; margin: 0 auto; font-size: 0.95rem; }
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding-bottom: 2rem; align-items: stretch; }
  .stack { display: flex; flex-direction: column; gap: 1.5rem; }
  .stack > .contact-card:last-child { flex: 1; }
  .contact-card { background: var(--surface); border: 1.5px solid var(--ink); padding: 1.6rem 1.9rem; position: relative; }
  .contact-card::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--line); pointer-events: none; }
  .contact-card h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
  .contact-card > p { color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 1rem; }
  .btn { padding: 0.75rem 1.5rem; font-family: 'Lora', serif; font-weight: 600; font-size: 0.93rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.6rem; border-radius: 3px; border: 1.5px solid transparent; cursor: pointer; }
  .btn-whatsapp { background: var(--whatsapp); color: var(--white); }
  .btn-whatsapp:hover { opacity: 0.9; }
  .btn-primary { background: var(--primary); color: var(--white); }
  .btn-primary:hover { background: var(--primary-light); }
