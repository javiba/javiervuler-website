<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | Javier Vuler</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input[type="text"], input[type="email"] { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; font-size: 16px; }
  button { margin-top: 20px; padding: 12px 24px; font-size: 16px; cursor: pointer; }
  #mensaje { margin-top: 20px; font-weight: 600; }
</style>
</head>
<body>

<h1>Pedí tu checklist del comprador</h1>
<p>Dejanos tu nombre y tu email y te enviamos el checklist en PDF.</p>

<form id="formulario">
  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <div class="g-recaptcha" data-sitekey="6LcodPYtAAAAAP080zI8haa_fzpWHXH9k4XeznKG" style="margin-top:20px"></div>

  <button type="submit">Quiero el checklist</button>
</form>

<p id="mensaje"></p>

<script>
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycby8qy4JpMVNTnA7aPmb9ikeUTJK5EZVVXy469ZfwAt3JdGvzwR4hk8msCNo019kaK8-uQ/exec';

document.getElementById('formulario').addEventListener('submit', function (e) {
  e.preventDefault();
  const form = e.target;
  const mensaje = document.getElementById('mensaje');

  if (grecaptcha.getResponse() === '') {
    mensaje.textContent = 'Primero marcá la casilla "No soy un robot".';
    return;
  }

  mensaje.textContent = 'Enviando...';

  const datos = new URLSearchParams(new FormData(form));

  fetch(URL_SCRIPT, {
    method: 'POST',
    mode: 'no-cors',
    body: datos
  }).then(function () {
    mensaje.textContent = '¡Listo! Revisá tu correo, te va a llegar el checklist.';
    form.reset();
    grecaptcha.reset();
  }).catch(function () {
    mensaje.textContent = 'Hubo un problema al enviar. Probá de nuevo en un rato.';
  });
});
</script>

</body>
</html>
